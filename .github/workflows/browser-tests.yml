name: Browser tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit and component tests
        run: npm test
      - name: Thirty-day diagnostic
        run: npm run diagnose:30-days
      - name: Browser tests
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            .tmp/browser-fixtures.json
            .wrangler/logs/
